spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/gaming_events?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-256-bit-value}
    expiration-ms: 86400000
springdoc:
  swagger-ui.path: /swagger-ui.html
