spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gaming_events}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:very-secure-arcadia-jwt-token-secret-key-for-dev-32bytes-long}
    expiration-ms: 86400000
springdoc:
  swagger-ui.path: /swagger-ui.html
