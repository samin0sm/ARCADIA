name: ARCADIA CI/CD Pipeline

on:
  push:
    branches: [ main, demo_cd ]
  pull_request:
    branches: [ main, demo_cd ]

jobs:
  backend-test:
    name: Backend Build & Tests (Java 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gaming_events
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Backend Maven Test Suite
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gaming_events
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          APP_JWT_SECRET: supersecretkey123456789012345678901234567890
          APP_JWT_EXPIRATION_MS: 86400000
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: frontend
        run: npm run build
