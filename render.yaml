services:
  # Spring Boot 3 Backend
  - type: web
    name: arcadia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: arcadia-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000

  # React Frontend (Static Site or Docker)
  - type: web
    name: arcadia-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: arcadia-backend
          property: host

databases:
  - name: arcadia-db
    databaseName: gaming_events
    user: postgres
    plan: free
    region: oregon
