services:
  postgres:
    image: postgres:16-alpine
    container_name: gaming-events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaming_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gaming-events-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaming_events"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arcadia-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming-events-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gaming_events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: supersecretkey123456789012345678901234567890
      APP_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    networks:
      - arcadia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaming-events-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - arcadia-network

volumes:
  gaming-events-postgres-data:

networks:
  arcadia-network:
    driver: bridge
